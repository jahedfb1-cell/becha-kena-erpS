name: Deploy to dhakablinds.shop

# Every push to main builds the frontend and ships it to the Hostinger
# server, mirroring deploy-frontend.sh (same two destinations, no --delete,
# same Laravel cache clears). Host/port/user/key live in GitHub Secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Say exactly which secret is missing instead of failing later with a vague message.
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_PORT" ] || missing="$missing SSH_PORT"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_KEY" ] || [ -n "$SSH_KEY_B64" ] || missing="$missing SSH_PRIVATE_KEY(or SSH_PRIVATE_KEY_B64)"
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secret(s):$missing"; exit 1; fi

          install -m 700 -d ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            # One-line base64 form of the key: immune to the line-break and clipboard
            # problems that make a pasted multi-line private key come out invalid.
            printf '%s' "$SSH_KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_deploy
          else
            # Strip Windows line endings (\r) that sneak in when the key is copied on Windows
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy

          # Describe the key without revealing it, so a bad paste can be diagnosed from this log.
          lines=$(wc -l < ~/.ssh/id_deploy)
          if head -1 ~/.ssh/id_deploy | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then header=yes; else header=no; fi
          if tail -1 ~/.ssh/id_deploy | grep -q 'END OPENSSH PRIVATE KEY'; then footer=yes; else footer=no; fi
          echo "key source: $([ -n "$SSH_KEY_B64" ] && echo base64 || echo plain), lines: $lines, BEGIN line: $header, END line: $footer"

          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::SSH private key is not valid (lines=$lines, BEGIN line=$header, END line=$footer). Re-copy the whole key file, or use the single-line SSH_PRIVATE_KEY_B64 secret."; exit 1; }
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload and install
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          tar -czf dbdist.tar.gz -C frontend/dist .
          OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes"
          scp $OPTS -P "$SSH_PORT" dbdist.tar.gz "$SSH_USER@$SSH_HOST:/tmp/dbdist.tar.gz"
          ssh $OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" DOMAIN="/home/$SSH_USER/domains/dhakablinds.shop" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STAGE=$(mktemp -d)
          tar -xzf /tmp/dbdist.tar.gz -C "$STAGE"
          for TARGET in "$DOMAIN/public_html" "$DOMAIN/laravel_app/public"; do
            cp -r "$STAGE"/. "$TARGET"/
          done
          cd "$DOMAIN/laravel_app"
          git stash push -q -- frontend/public/apple-touch-icon.png frontend/public/pwa-192x192.png frontend/public/pwa-512x512.png || true
          git fetch origin main -q && git merge --ff-only origin/main
          php artisan config:clear && php artisan route:clear && php artisan cache:clear && php artisan view:clear
          grep -o 'assets/index-[A-Za-z0-9_-]*\.js' "$DOMAIN/laravel_app/public/index.html"
          rm -rf "$STAGE" /tmp/dbdist.tar.gz
          REMOTE
